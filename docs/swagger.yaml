basePath: /api
definitions:
  domain.AuthResponse:
    properties:
      accessToken:
        type: string
      refreshToken:
        type: string
    type: object
  domain.ErrorResponse:
    properties:
      message:
        type: string
    type: object
  domain.Favorite:
    properties:
      created_at:
        type: string
      id:
        type: string
      policy_id:
        type: string
      user_id:
        type: string
    type: object
  domain.Gender:
    enum:
    - MALE
    - FEMALE
    - OTHER
    type: string
    x-enum-varnames:
    - GenderMale
    - GenderFemale
    - GenderOther
  domain.Interest:
    enum:
    - EMPLOYMENT
    - HOUSING
    - EDUCATION
    - WELFARE
    - PREGNANCY
    - CULTURE
    - ENVIRONMENT
    - PARTICIPATION
    type: string
    x-enum-varnames:
    - InterestEmployment
    - InterestHousing
    - InterestEducation
    - InterestWelfare
    - InterestPregnancy
    - InterestCulture
    - InterestEnvironment
    - InterestParticipation
  domain.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  domain.Match:
    enum:
    - 0
    - 1
    - 2
    type: integer
    x-enum-varnames:
    - MatchPOSSIBLE
    - MatchUNCERTAIN
    - MatchIMPOSSIBLE
  domain.Notification:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_read:
        type: boolean
      message:
        type: string
      metadata:
        type: object
      receiver_id:
        type: string
      type:
        $ref: '#/definitions/domain.NotificationType'
    type: object
  domain.NotificationCountResponse:
    properties:
      count:
        type: integer
    type: object
  domain.NotificationType:
    enum:
    - 0
    - 1
    - 2
    type: integer
    x-enum-varnames:
    - NotificationTypeSTAR
    - NotificationTypeINTEREST
    - NotificationTypeTIME
  domain.Policy:
    properties:
      address:
        type: string
      condition:
        $ref: '#/definitions/domain.PolicyCondition'
      description:
        type: string
      endDate:
        type: string
      id:
        type: string
      latitude:
        format: float64
        type: number
      longitude:
        format: float64
        type: number
      regionCode:
        type: integer
      startDate:
        type: string
      title:
        type: string
    type: object
  domain.PolicyCondition:
    properties:
      gender:
        $ref: '#/definitions/domain.Gender'
      interests:
        items:
          $ref: '#/definitions/domain.Interest'
        type: array
      max_age:
        type: integer
      min_age:
        type: integer
      region_codes:
        items:
          type: integer
        type: array
      require_business:
        type: boolean
      require_disabled:
        type: boolean
      require_foreign:
        type: boolean
      require_pregnant:
        type: boolean
      require_student:
        type: boolean
      require_youth:
        type: boolean
      source_url:
        description: |-
          외부 API(온통청년/복지로)가 제공하는 신청/원문 페이지 URL.
          ent 스키마 변경 없이 JSON 컬럼(condition)에 함께 저장하기 위해 여기 추가함.
        type: string
      unparsed_conditions:
        items:
          type: string
        type: array
    type: object
  domain.PolicyResponse:
    properties:
      address:
        type: string
      description:
        type: string
      end_date:
        type: string
      id:
        type: string
      interests:
        items:
          $ref: '#/definitions/domain.Interest'
        type: array
      latitude:
        type: number
      longitude:
        type: number
      region_code:
        type: integer
      source_url:
        type: string
      start_date:
        type: string
      status:
        $ref: '#/definitions/domain.Match'
      title:
        type: string
    type: object
  domain.Profile:
    properties:
      age:
        type: integer
      created_at:
        type: string
      email:
        type: string
      gender:
        $ref: '#/definitions/domain.Gender'
      id:
        type: string
      interests:
        items:
          $ref: '#/definitions/domain.Interest'
        type: array
      is_business:
        type: boolean
      is_disabled:
        type: boolean
      is_foreign:
        type: boolean
      is_pregnant:
        type: boolean
      is_student:
        type: boolean
      is_youth:
        type: boolean
      name:
        type: string
      region:
        type: integer
    type: object
  domain.RefreshTokenRequest:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  domain.SignupRequest:
    properties:
      age:
        type: integer
      email:
        type: string
      gender:
        $ref: '#/definitions/domain.Gender'
      interests:
        items:
          $ref: '#/definitions/domain.Interest'
        type: array
      is_business:
        type: boolean
      is_disabled:
        type: boolean
      is_foreign:
        type: boolean
      is_pregnant:
        type: boolean
      is_student:
        type: boolean
      is_youth:
        type: boolean
      name:
        type: string
      password:
        type: string
      region:
        type: integer
    required:
    - age
    - email
    - gender
    - interests
    - is_business
    - is_disabled
    - is_foreign
    - is_pregnant
    - is_student
    - is_youth
    - name
    - password
    - region
    type: object
host: localhost:8080
info:
  contact: {}
  description: PICO Backend API
  title: PICO Backend API
  version: "1.0"
paths:
  /login:
    post:
      consumes:
      - application/json
      description: 로그인
      parameters:
      - description: 로그인 요청
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.AuthResponse'
        "400":
          description: 잘못된 요청
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: 인증 실패
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: 서버 오류
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: 로그인
      tags:
      - Auth
  /notification/protected:
    get:
      consumes:
      - application/json
      description: 현재 로그인한 사용자의 모든 알림을 조회합니다.
      produces:
      - application/json
      responses:
        "200":
          description: 알림 목록
          schema:
            items:
              $ref: '#/definitions/domain.Notification'
            type: array
        "401":
          description: 인증 실패
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 서버 내부 오류
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 현재 사용자의 모든 알림 조회
      tags:
      - 알림
  /notification/protected/{id}:
    delete:
      consumes:
      - application/json
      description: 알림 ID를 이용하여 해당 알림을 삭제합니다.
      parameters:
      - description: 알림 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 성공 응답
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: '잘못된 요청 (예: ID 변환 실패)'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 인증 실패
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 서버 내부 오류
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 특정 알림 삭제
      tags:
      - 알림
    patch:
      consumes:
      - application/json
      description: 알림 ID를 이용하여 해당 알림을 읽음 상태로 변경합니다.
      parameters:
      - description: 알림 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 성공 응답
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: '잘못된 요청 (예: ID 변환 실패)'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 인증 실패
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 서버 내부 오류
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 특정 알림 읽음 처리
      tags:
      - 알림
  /notification/protected/unread-count:
    get:
      consumes:
      - application/json
      description: 현재 로그인한 사용자의 읽지 않은 알림 총 개수를 조회합니다.
      produces:
      - application/json
      responses:
        "200":
          description: 읽지 않은 알림 개수
          schema:
            $ref: '#/definitions/domain.NotificationCountResponse'
        "401":
          description: 인증 실패
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 서버 내부 오류
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 읽지 않은 알림 개수 조회
      tags:
      - 알림
  /policy:
    get:
      description: 정책 리스트 반환
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Policy'
            type: array
        "401":
          description: 인증되지 않은 사용자
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: 서버 오류
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 정책 조회
      tags:
      - Policy
  /policy/protected:
    get:
      description: 정책 리스트 반환
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.PolicyResponse'
            type: array
        "401":
          description: 인증되지 않은 사용자
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: 서버 오류
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 정책 조회
      tags:
      - Policy
  /policy/protected/favorite/{id}:
    delete:
      description: 특정 정책을 즐겨찾기에서 제거합니다.
      parameters:
      - description: 정책 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 정책 즐겨찾기 해제
      tags:
      - Policy
    post:
      description: 특정 정책을 즐겨찾기에 등록합니다.
      parameters:
      - description: 정책 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Favorite'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 정책 즐겨찾기 등록
      tags:
      - Policy
  /policy/protected/favorites:
    get:
      description: 로그인한 사용자의 즐겨찾기한 정책 목록을 조회합니다.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.PolicyResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 즐겨찾기 정책 목록 조회
      tags:
      - Policy
  /policy/protected/reclassify:
    post:
      description: 카테고리(interests) 분류가 안 된 기존 정책들을 AI로 다시 분류합니다.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: integer
            type: object
        "500":
          description: 서버 오류
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 기존 정책 카테고리 재분류 (관리자용)
      tags:
      - Policy
  /policy/protected/region:
    get:
      description: 현재 로그인한 사용자의 지역에 해당하는 정책 리스트 반환
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.PolicyResponse'
            type: array
        "401":
          description: 인증되지 않은 사용자
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: 서버 오류
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 내 지역 정책 조회
      tags:
      - Policy
  /profile/protected:
    get:
      description: 현재 로그인한 사용자의 프로필 정보를 조회합니다.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Profile'
        "401":
          description: 인증되지 않은 사용자
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: 프로필을 찾을 수 없음
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: 서버 오류
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 내 프로필 조회
      tags:
      - Profile
    put:
      description: 현재 로그인한 사용자의 정보를 수정합니다.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Profile'
        "401":
          description: 인증되지 않은 사용자
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: 프로필을 찾을 수 없음
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: 서버 오류
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 내 정보 수정
      tags:
      - Profile
  /refresh:
    post:
      consumes:
      - application/json
      description: Refresh Token 으로 새로운 Access Token과 Refresh Token을 발급
      parameters:
      - description: 토큰 갱신 요청
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.AuthResponse'
        "400":
          description: 잘못된 요청
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: 유효하지 않은 Refresh Token
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: 서버 오류
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: 토큰 갱신
      tags:
      - Auth
  /signup:
    post:
      consumes:
      - application/json
      description: 이름, 이메일, 비밀번호를 사용하여 회원가입
      parameters:
      - description: 회원가입 요청
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.SignupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.AuthResponse'
        "400":
          description: 잘못된 요청
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "409":
          description: 이미 존재하는 사용자
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: 서버 오류
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: 회원가입
      tags:
      - Auth
securityDefinitions:
  BearerAuth:
    description: Enter your JWT token with the `Bearer ` prefix.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
